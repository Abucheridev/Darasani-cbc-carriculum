<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2447b8">
<meta name="description" content="Darasani: Grade 7 CBC revision quizzes for all subjects">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Darasani – Grade 7 Revision</title>
<style>
:root{--bg:#eef3f9;--card:#fbfdff;--tx:#1a2a5c;--mu:#58668a;--ink:#2447b8;--red:#d64550;--ok:#1f8a5b;--okbg:#dff3e8;--badbg:#fbe3e5;--line:#cfdcef;--hl:#ffe66d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1530;--card:#171f45;--tx:#e6ebff;--mu:#9aa6d1;--ink:#8fa8ff;--red:#ff7a85;--ok:#5fd29b;--okbg:#14382b;--badbg:#3e1a22;--line:#2a3563;--hl:#6b5f00;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1530;--card:#171f45;--tx:#e6ebff;--mu:#9aa6d1;--ink:#8fa8ff;--red:#ff7a85;--ok:#5fd29b;--okbg:#14382b;--badbg:#3e1a22;--line:#2a3563;--hl:#6b5f00;color-scheme:dark}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:560px;margin:0 auto;padding:16px 16px 40px}
h1{font:800 28px/1.1 "Trebuchet MS",system-ui,sans-serif;margin:8px 0 2px}
h1 span{background:linear-gradient(transparent 55%,var(--hl) 55%)}
h2{font:700 20px/1.35 "Trebuchet MS",system-ui,sans-serif;margin:0 0 14px}
h3{font:700 17px "Trebuchet MS",system-ui,sans-serif;margin:22px 0 8px}
.sub{color:var(--mu);margin:0 0 16px}
.stats{display:flex;gap:10px;margin-bottom:6px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:22px}
.stat small{color:var(--mu)}
.weak{background:var(--badbg);border-left:4px solid var(--red);border-radius:6px;padding:10px 12px;margin:12px 0}
.topic{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:13px 14px;margin-bottom:8px;font:inherit;cursor:pointer}
.topic small{color:var(--mu);display:block}
.badge{font-weight:700;padding:3px 10px;border-radius:99px;background:var(--line);white-space:nowrap}
.badge.good{background:var(--okbg);color:var(--ok)}
.badge.low{background:var(--badbg);color:var(--red)}
.link{background:none;border:0;color:var(--ink);font:inherit;font-weight:600;padding:6px 0;cursor:pointer}
.meta{color:var(--mu);font-size:14px}
.bar{height:8px;background:var(--line);border-radius:9px;margin:8px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);transition:width .3s}
.count{color:var(--mu);font-size:14px;margin-bottom:12px}
.qcard{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--red);border-radius:6px;padding:16px 16px 6px 18px;margin-bottom:14px;background-image:repeating-linear-gradient(transparent,transparent 27px,var(--line) 28px)}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:2px solid var(--line);border-radius:10px;padding:13px 14px;margin-bottom:10px;font:inherit;cursor:pointer}
.opt:disabled{cursor:default;opacity:1}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--red);background:var(--badbg)}
.exp{background:var(--card);border:1px dashed var(--ink);border-radius:8px;padding:10px 12px;margin:4px 0 12px}
.btn{display:block;width:100%;background:var(--ink);color:#fff;border:0;border-radius:10px;padding:14px;font:700 16px inherit;font-family:inherit;cursor:pointer;margin-top:8px}
:root[data-theme="dark"] .btn:not(.alt){color:#0f1530}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn:not(.alt){color:#0f1530}}
.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--ink)}
.big{font:800 56px/1 "Trebuchet MS",system-ui,sans-serif;margin:10px 0}
.center{text-align:center}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:14px}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px}
summary{font:700 17px "Trebuchet MS",system-ui,sans-serif;padding:12px 0;cursor:pointer;border-bottom:1px solid var(--line)}summary small{color:var(--mu);font-weight:400}details{margin-top:4px}details[open]>summary{margin-bottom:10px}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
</style>
</head>

<div id="app"></div>

{s:"Integrated Science",t:"Cells",q:"What is the basic unit of life?",o:["Tissue","Organ","Cell","Atom"],a:2,e:"All living things are made of cells. The cell is the smallest unit of life."},
{s:"Integrated Science",t:"Cells",q:"Which part of a cell controls its activities?",o:["Nucleus","Cell wall","Vacuole","Cell membrane"],a:0,e:"The nucleus is the control centre of the cell. It holds the genetic material."},
{s:"Integrated Science",t:"Cells",q:"Which structure is found in plant cells but not in animal cells?",o:["Nucleus","Cytoplasm","Cell membrane","Cell wall"],a:3,e:"Plant cells have a rigid cell wall outside the membrane that gives them support."},

{s:"Integrated Science",t:"Mixtures",q:"Salt dissolved in water forms a:",o:["Solution","Metal","Gas","Element"],a:0,e:"When a solid dissolves completely in a liquid, the mixture is called a solution."},
{s:"Integrated Science",t:"Mixtures",q:"Which method recovers salt from salty water?",o:["Filtration","Sieving","Evaporation","Using a magnet"],a:2,e:"Heating the salty water makes the water evaporate and leaves the salt behind."},
{s:"English",t:"Parts of Speech",q:"Which word is a noun in this sentence? The girl sang happily.",o:["girl","sang","happily","the"],a:0,e:"A noun names a person, place or thing. “Girl” is the person."},
{s:"English",t:"Parts of Speech",q:"Choose the adjective: The tall boy kicked the ball.",o:["boy","kicked","tall","ball"],a:2,e:"An adjective describes a noun. “Tall” describes the boy."},

{s:"English",t:"Tenses",q:"Yesterday, we ___ to the market.",o:["go","went","going","gone"],a:1,e:"“Yesterday” shows the past, so we use the past tense “went”."},
{s:"English",t:"Tenses",q:"Which sentence is correct?",o:["She have a book.","She haves a book.","She has a book.","She having a book."],a:2,e:"With she, he and it in the present tense, we use “has”."},

{s:"Kiswahili",t:"Msamiati",q:"Kinyume cha “baridi” ni nini?",o:["mvua","upepo","joto","theluji"],a:2,e:"Baridi ni cold. Kinyume chake ni joto (hot or warm)."},
{s:"Kiswahili",t:"Msamiati",q:"Chakula kinachopikwa kwa unga wa mahindi ni:",o:["wali","ugali","mkate","chapati"],a:1,e:"Ugali hupikwa kwa unga wa mahindi na hupendwa sana nchini Kenya."},
{s:"Kiswahili",t:"Umoja na Wingi",q:"Wingi wa “kitabu” ni:",o:["kitabu","vitabu","vikitabu","watabu"],a:1,e:"Maneno ya ngeli ya KI-VI hubadilika kutoka ki- hadi vi-. Kitabu kinakuwa vitabu."},
{s:"Kiswahili",t:"Umoja na Wingi",q:"Wingi wa “mtoto” ni:",o:["mtoto","vitoto","watoto","wato"],a:2,e:"Maneno ya ngeli ya M-WA hubadilika kutoka m- hadi wa-. Mtoto anakuwa watoto."},
{s:"Kiswahili",t:"Umoja na Wingi",q:"Wingi wa “kiti” ni:",o:["vikiti","miti","kiti","viti"],a:3,e:"Kiti kinakuwa viti. Kumbuka, miti ni wingi wa mti, si wa kiti."},
{s:"Social Studies",t:"Map Work",q:"Which instrument shows direction?",o:["Ruler","Compass","Thermometer","Clock"],a:1,e:"A compass has a needle that points north, so you can find other directions."},
{s:"Social Studies",t:"Map Work",q:"Which direction is opposite to north?",o:["East","West","South","North-east"],a:2,e:"North and south are opposite each other. East and west are also opposites."},

{s:"Social Studies",t:"Kenya and Africa",q:"What is the highest mountain in Kenya?",o:["Mount Elgon","Mount Kenya","Mount Kilimanjaro","Mount Longonot"],a:1,e:"Mount Kenya is the highest mountain in Kenya. Kilimanjaro is higher but it is in Tanzania."},
{s:"Social Studies",t:"Kenya and Africa",q:"Which is the largest lake in Africa?",o:["Lake Turkana","Lake Victoria","Lake Naivasha","Lake Nakuru"],a:1,e:"Lake Victoria is the largest lake in Africa by area. Kenya shares it with Uganda and Tanzania."},
{s:"Agriculture & Nutrition",t:"Crop Farming",q:"Which of these is a cash crop in Kenya?",o:["Maize","Tea","Beans","Millet"],a:1,e:"Tea is grown mainly to be sold and exported. Maize, beans and millet are mostly food crops."},
{s:"Agriculture & Nutrition",t:"Crop Farming",q:"Loosening the soil before planting is called:",o:["Weeding","Tilling","Harvesting","Pruning"],a:1,e:"Tilling (digging or ploughing) breaks up the soil so roots can grow and water can enter."},
{s:"Agriculture & Nutrition",t:"Crop Farming",q:"Removing unwanted plants from a crop field is called:",o:["Mulching","Grafting","Weeding","Threshing"],a:2,e:"Weeds compete with crops for water, light and nutrients, so we remove them by weeding."},

{s:"Agriculture & Nutrition",t:"Nutrition",q:"Which vitamin do oranges provide in large amounts?",o:["Vitamin A","Vitamin D","Vitamin K","Vitamin C"],a:3,e:"Oranges and other citrus fruits are rich in vitamin C, which helps fight infections."},

{s:"Pre-Technical Studies",t:"Tools and Safety",q:"Which tool is used to cut wood?",o:["Saw","Screwdriver","Spanner","Pliers"],a:0,e:"A saw has teeth that cut through wood."},
{s:"Pre-Technical Studies",t:"Tools and Safety",q:"What should you wear to protect your eyes in a workshop?",o:["Gloves","Apron","Safety goggles","Boots"],a:2,e:"Safety goggles protect your eyes from dust, chips and sparks."},
{s:"Pre-Technical Studies",t:"Drawing and Materials",q:"Which instrument is used to draw a circle?",o:["Protractor","Set square","Ruler","Compass"],a:3,e:"A compass has a point and a pencil, so it can draw circles and arcs."},
{s:"Pre-Technical Studies",t:"Drawing and Materials",q:"Which instrument is used to measure angles?",o:["Protractor","Compass","Divider","Tape measure"],a:0,e:"A protractor measures angles in degrees."},

{s:"Creative Arts & Sports",t:"Art and Music",q:"Which set has only primary colours?",o:["Red, blue, yellow","Green, orange, purple","Black, white, grey","Red, green, brown"],a:0,e:"Red, blue and yellow are the primary colours. We cannot make them by mixing other colours."},

{s:"Creative Arts & Sports",t:"Art and Music",q:"A group of people singing together is called a:",o:["Band","Choir","Duo","Solo"],a:1,e:"A choir is a group of singers who perform together."},
{s:"Creative Arts & Sports",t:"Sports and Games",q:"How many players from one team are on the pitch in a football match?",o:["9","10","11","12"],a:2,e:"Each football team has 11 players on the pitch, including the goalkeeper."},

{s:"Religious Education (CRE)",t:"Creation",q:"Which book of the Bible begins with the story of creation?",o:["Genesis","Exodus","Psalms","Matthew"],a:0,e:"Genesis means beginning. It is the first book of the Bible."},

];

['Integers','Which list is in order from smallest to largest?',['-1, -3, 0, 2','-3, -1, 0, 2','0, -1, -3, 2','2, 0, -1, -3'],1,'Negative numbers get smaller as they move away from zero, so -3 comes before -1.'],

const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let store={};
try{store=JSON.parse(localStorage.getItem("somojr7")||"{}")}catch(e){store={}}
store.scores=store.scores||{};store.custom=store.custom||[];
const save=()=>{try{localStorage.setItem("somojr7",JSON.stringify(store))}catch(e){}};
const all=()=>BASE.concat(store.custom);
const key=(s,t)=>s+"|"+t;
let S={};

function home(){
  const qs=all(),subs=[...new Set(qs.map(q=>q.s))];
  const sc=Object.values(store.scores);
  const avg=sc.length?Math.round(sc.reduce((a,v)=>a+v.last,0)/sc.length):0;
  const taken=sc.reduce((a,v)=>a+v.n,0);
  const weak=Object.entries(store.scores).filter(([,v])=>v.last<60).map(([k])=>k.split("|")[1]);
  let h=`<h1><span>Darasani</span></h1><p class="sub">Grade 7 CBC revision. Pick a topic and test yourself.</p>
  <div class="stats"><div class="stat"><b>${taken}</b><small>Quizzes taken</small></div><div class="stat"><b>${sc.length?avg+"%":"–"}</b><small>Average score</small></div></div>`;
  if(weak.length)h+=`<div class="weak"><b>Revise these next:</b> ${weak.map(esc).join(", ")}</div>`;
  subs.forEach(s=>{
    h+=`<details><summary>${esc(s)} <small>(${qs.filter(q=>q.s===s).length} questions)</small></summary>`;
    [...new Set(qs.filter(q=>q.s===s).map(q=>q.t))].forEach(t=>{
      const n=qs.filter(q=>q.s===s&&q.t===t).length,v=store.scores[key(s,t)];
      const b=v?`<span class="badge ${v.last>=70?"good":v.last<60?"low":""}">${v.last}%</span>`:`<span class="badge">New</span>`;
      h+=`<button class="topic" data-a="quiz" data-s="${esc(s)}" data-t="${esc(t)}"><span>${esc(t)}<small>${n} questions</small></span>${b}</button>`;
    });
    h+="</details>";
  });
  h+=`<button class="btn alt" data-a="add" style="margin-top:22px">Add a question</button>`;
  app.innerHTML=h;
}
function quiz(s,t){
  S={s,t,list:all().filter(q=>q.s===s&&q.t===t).sort(()=>Math.random()-.5),i:0,c:0,locked:false};
  showQ();
}
function showQ(){
  const q=S.list[S.i],n=S.list.length;
  app.innerHTML=`<button class="link" data-a="home">← Back to topics</button>
  <div class="meta">${esc(S.s)}, ${esc(S.t)}</div>
  <div class="bar"><i style="width:${S.i/n*100}%"></i></div>
  <div class="count">Question ${S.i+1} of ${n}</div>
  <div class="qcard"><h2>${esc(q.q)}</h2></div>
  ${q.o.map((o,i)=>`<button class="opt" data-a="pick" data-i="${i}">${esc(o)}</button>`).join("")}
  <div id="fb"></div>`;
  window.scrollTo(0,0);
}
function pick(i){
  if(S.locked)return;S.locked=true;
  const q=S.list[S.i];
  document.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add("ok");else if(j===i)b.classList.add("bad")});
  if(i===q.a)S.c++;
  $("#fb").innerHTML=`<div class="exp"><b>${i===q.a?"Correct!":"Not quite."}</b> ${esc(q.e||"")}</div><button class="btn" data-a="next">${S.i+1<S.list.length?"Next question":"See my result"}</button>`;
  $("#fb").scrollIntoView({block:"nearest",behavior:"smooth"});
}
function next(){S.locked=false;S.i++;S.i<S.list.length?showQ():result()}
function result(){
  const n=S.list.length,p=Math.round(S.c/n*100),k=key(S.s,S.t),o=store.scores[k]||{best:0,n:0};
  store.scores[k]={best:Math.max(o.best,p),last:p,n:o.n+1};save();
  const m=p>=80?"Excellent work!":p>=50?"Good effort. Try again to improve.":"Keep practising. Read the explanations, then try again.";
  app.innerHTML=`<div class="center"><div class="meta">${esc(S.s)}, ${esc(S.t)}</div><div class="big">${p}%</div><h2>${S.c} out of ${n} correct</h2><p class="sub">${m}</p></div>
  <button class="btn" data-a="quiz" data-s="${esc(S.s)}" data-t="${esc(S.t)}">Try again</button>
  <button class="btn alt" data-a="home">Back to topics</button>`;
}
function addView(){
  const subs=[...new Set(all().map(q=>q.s))];
  app.innerHTML=`<button class="link" data-a="home">← Back to topics</button><h2>Add a question</h2>
  <p class="sub">Saved on this device only.</p>
  <label for="as">Subject</label><input id="as" list="sl" placeholder="e.g. Mathematics"><datalist id="sl">${subs.map(s=>`<option value="${esc(s)}">`).join("")}</datalist>
  <label for="at">Topic</label><input id="at" placeholder="e.g. Fractions">
  <label for="aq">Question</label><textarea id="aq" rows="2"></textarea>
  <label for="o0">Option A</label><input id="o0"><label for="o1">Option B</label><input id="o1"><label for="o2">Option C</label><input id="o2"><label for="o3">Option D</label><input id="o3">
  <label for="ac">Correct answer</label><select id="ac"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select>
  <label for="ae">Explanation</label><textarea id="ae" rows="2"></textarea>
  <p id="msg" class="meta" role="status"></p>
  <button class="btn" data-a="saveq">Save question</button>`;
}
function saveQ(){
  const v=id=>$("#"+id).value.trim(),o=[v("o0"),v("o1"),v("o2"),v("o3")];
  if(!v("as")||!v("at")||!v("aq")||o.some(x=>!x)){$("#msg").textContent="Fill in the subject, topic, question and all four options.";return}
  store.custom.push({s:v("as"),t:v("at"),q:v("aq"),o,a:+$("#ac").value,e:v("ae")});save();
  ["aq","o0","o1","o2","o3","ae"].forEach(id=>$("#"+id).value="");
  $("#msg").textContent="Question saved. Add another or go back to topics.";
}
app.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b)return;
  const a=b.dataset.a;
  if(a==="home")home();
  else if(a==="quiz")quiz(b.dataset.s,b.dataset.t);
  else if(a==="pick")pick(+b.dataset.i);
  else if(a==="next")next();
  else if(a==="add")addView();
  else if(a==="saveq")saveQ();
});
home();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}</script>
</body>
</html>
